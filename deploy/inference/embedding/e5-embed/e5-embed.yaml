apiVersion: v1
kind: Namespace
metadata:
  name: kit-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e5-embed
  namespace: kit-ai
  labels:
    app.kubernetes.io/name: e5-embed
    app.kubernetes.io/component: embedding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e5-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e5-embed
        app.kubernetes.io/component: embedding
    spec:
      nodeSelector:
        kubernetes.io/hostname: witty-coyote
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ngc-pull
      containers:
        - name: nim
          image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5-pb6:1.14.4-stig-fips-x86@sha256:8bfa4f2cd6ef7f01a5be89d774b5a23d4541bedc1882ea385586971aad9d8094
          imagePullPolicy: IfNotPresent
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-runtime
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: nim-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: e5-embed
  namespace: kit-ai
  annotations:
    metallb.io/address-pool: private-pool
    metallb.io/loadBalancerIPs: 192.168.100.196
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: e5-embed
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
